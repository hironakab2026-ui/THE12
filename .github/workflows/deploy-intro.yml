# 紹介ページ（intro/）と会員ページ（member/）を GitHub Pages に公開する。
# main に push されると自動でビルドして更新する。
#   紹介ページ: https://hironakab2026-ui.github.io/THE12/
#   会員ページ: https://hironakab2026-ui.github.io/THE12/member/
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "intro/**"
      - "member/**"
      - ".github/workflows/deploy-intro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            intro/package-lock.json
            member/package-lock.json
      - name: Build intro
        working-directory: intro
        run: |
          npm ci
          npm run build
      - name: Build member
        working-directory: member
        run: |
          npm ci
          npm run build
      # 会員ページを紹介ページの下（/member/）に置く
      - run: cp -r member/dist intro/dist/member
      - uses: actions/upload-pages-artifact@v3
        with:
          path: intro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
